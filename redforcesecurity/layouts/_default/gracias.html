{{ define "main" }}
<style>
    .gracias-section {
        min-height: 65vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        padding: 80px 20px;
    }
    .gracias-card {
        text-align: center;
        max-width: 560px;
        width: 100%;
    }
    .gracias-check {
        width: 80px;
        height: 80px;
        background: #e63946;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 28px auto;
    }
    .gracias-check svg {
        width: 40px;
        height: 40px;
        stroke: white;
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    .gracias-titulo {
        font-family: 'Orbitron', sans-serif;
        font-size: 2rem;
        color: #0F172A;
        margin-bottom: 16px;
        text-transform: uppercase;
    }
    .gracias-msg {
        font-size: 1.05rem;
        color: #475569;
        line-height: 1.7;
        margin-bottom: 36px;
    }
    .gracias-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #fff5f5;
        border: 1px solid #feb2b2;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 0.85rem;
        color: #742a2a;
        margin-bottom: 36px;
    }
    .gracias-btn {
        display: inline-block;
        background: #e63946;
        color: white;
        text-decoration: none;
        padding: 14px 36px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        border-radius: 4px;
        letter-spacing: 1px;
        transition: opacity 0.3s;
    }
    .gracias-btn:hover { opacity: 0.85; color: white; }
    @media (max-width: 480px) {
        .gracias-titulo { font-size: 1.5rem; }
        .gracias-check { width: 64px; height: 64px; }
        .gracias-check svg { width: 32px; height: 32px; }
    }
</style>
<meta name="robots" content="{{ .Params.robots | default "noindex,nofollow" }}">

<section class="gracias-section">
    <div class="gracias-card">
        <div class="gracias-check">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h1 class="gracias-titulo">&#161;Solicitud recibida!</h1>
        <p class="gracias-msg">
            Gracias por contactar con RedForce Security.<br>
            Te responderemos en <strong>menos de 24 horas</strong>.
        </p>
        <div class="gracias-badge">
            <span>&#128274;</span>
            <span>Tu informaci&oacute;n est&aacute; protegida y es completamente confidencial.</span>
        </div>
        <br>
        <a href="/" class="gracias-btn">&#8592; Volver al inicio</a>
    </div>
</section>
{{ end }}
