{{ define "main" }}
<style>
    .gracias-wrap {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 80px 20px;
    }
    .gracias-icon { font-size: 4rem; margin-bottom: 20px; }
    .gracias-titulo { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: var(--azul); margin-bottom: 16px; }
    .gracias-msg { font-size: 1.1rem; color: #475569; max-width: 500px; margin-bottom: 40px; line-height: 1.7; }
    .gracias-btn {
        display: inline-block;
        background: var(--rojo);
        color: white;
        text-decoration: none;
        padding: 14px 32px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        border-radius: 4px;
        transition: opacity 0.3s;
    }
    .gracias-btn:hover { opacity: 0.85; }
</style>

<meta name="robots" content="noindex, nofollow">

<section class="gracias-wrap">
    <div class="gracias-icon">&#10003;</div>
    <h1 class="gracias-titulo">Solicitud recibida</h1>
    <p class="gracias-msg">Gracias por contactarnos. Te responderemos en menos de 24 horas.</p>
    <a href="/" class="gracias-btn">&#8592; Volver al inicio</a>
</section>
{{ end }}
