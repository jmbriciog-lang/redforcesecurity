<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedForce Security | Ciberseguridad Ofensiva</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --rojo: #D90429; --azul: #0F172A; --fondo: #f9fafb; --texto: #1E293B; }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; }
        body { font-family: 'Montserrat', sans-serif; color: var(--texto); background: #e2e8f0; line-height: 1.6; display: flex; flex-direction: column; }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.06; pointer-events: none; z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; color: var(--azul); font-weight: 800; text-transform: uppercase; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 40px; width: 100%; box-sizing: border-box; }
        .nav { background: var(--azul); height: 80px; position: fixed; width: 100%; z-index: 1000; display: flex; align-items: center; border-bottom: 3px solid var(--rojo); }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; }
        .nav-logo img { height: 45px; width: auto; display: block; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a { color: white; text-decoration: none; margin-left: 30px; font-weight: 700; font-size: 0.9rem; letter-spacing: 1px; font-family: 'Orbitron'; }
        .nav-links a:hover { color: var(--rojo); }
        .nav-links a.nav-contacto { color: var(--rojo); }
        .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; }
        .nav-toggle span { display: block; width: 28px; height: 3px; background: white; margin: 5px 0; border-radius: 2px; transition: 0.3s; }
        .btn { padding: 15px 30px; border-radius: 4px; font-family: 'Orbitron'; font-weight: 700; text-decoration: none; display: inline-block; transition: 0.3s; font-size: 0.9rem; border: none; cursor: pointer; }
        .btn-red { background: var(--rojo); color: white; }
        .btn-outline { border: 2px solid var(--azul); color: var(--azul); }
        main { flex: 1 0 auto; }
        .bg-neutral-50, .bg-white { background-color: #ffffff !important; }

        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            .nav { height: 65px; }
            .nav-logo img { height: 35px; }
            main { padding-top: 65px !important; }
            .nav-toggle { display: block; }
            .nav-links {
                display: none;
                position: absolute;
                top: 65px;
                left: 0;
                width: 100%;
                background: var(--azul);
                flex-direction: column;
                padding: 20px 0;
                border-bottom: 3px solid var(--rojo);
            }
            .nav-links.active { display: flex; }
            .nav-links a { margin: 0; padding: 15px 30px; width: 100%; text-align: left; font-size: 1rem; }
            .nav-links a:hover { background: rgba(255,255,255,0.05); }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="container nav-inner">
            <a href="/" class="nav-logo"><img src="/img/logo.png" alt="RedForce Logo"></a>
            <button class="nav-toggle" aria-label="Men&uacute;" onclick="document.querySelector('.nav-links').classList.toggle('active')">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links">
                <a href="/">Inicio</a>
                <a href="/servicios/">Servicios</a>
                <a href="/equipo/">Equipo</a>
                <a href="/contacto/" class="nav-contacto">Contacto</a>
            </div>
        </div>
    </nav>
    <main style="padding-top: 80px;">{{ block "main" . }}{{ end }}</main>
</body>
</html>
